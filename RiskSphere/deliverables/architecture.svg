<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 980" width="1100" height="980" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
</defs>
<rect width="1100" height="980" fill="#FFFFFF"/>
<text x="550" y="32" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">RiskSphere - System Architecture</text>
<text x="550" y="52" text-anchor="middle" font-size="12" fill="#6B7280">The model plans and phrases. Python computes and verifies. A draft changes the book only after a person signs.</text>

<rect x="180" y="70" width="520" height="48" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.6"/>
<text x="440" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">ANALYST - console</text>
<line x1="440" y1="118" x2="440" y2="146" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>

<rect x="180" y="146" width="520" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
<text x="440" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#7F1D1D">1  GUARDRAILS</text>
<text x="440" y="186" text-anchor="middle" font-size="11" fill="#374151">Kill switch, injection, personal data, send or book, legal, scope</text>
<text x="440" y="202" text-anchor="middle" font-size="11" fill="#374151">First failure stops the rest. No plan is sent.</text>
<rect x="740" y="146" width="320" height="72" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
<text x="900" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#7F1D1D">REFUSE</text>
<text x="900" y="194" text-anchor="middle" font-size="11" fill="#374151">Nothing is sent, booked, or approved</text>
<line x1="700" y1="182" x2="740" y2="182" stroke="#DC2626" stroke-width="1.8" marker-end="url(#a)"/>
<text x="720" y="174" text-anchor="middle" font-size="11" font-style="italic" fill="#DC2626">blocked</text>
<line x1="440" y1="218" x2="440" y2="246" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
<text x="468" y="238" font-size="11" font-style="italic" fill="#64748B">allowed</text>

<rect x="180" y="246" width="520" height="78" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
<text x="440" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">2  ORCHESTRATOR - Qwen3-8B</text>
<text x="440" y="286" text-anchor="middle" font-size="11" fill="#374151">One JSON plan, at most four tools. Temperature 0. /no_think.</text>
<text x="440" y="302" text-anchor="middle" font-size="11" fill="#374151">Does not compute a number. Invalid JSON is recorded and not trusted.</text>
<rect x="740" y="246" width="320" height="78" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="900" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#4C1D95">VALIDATE THE PLAN</text>
<text x="900" y="294" text-anchor="middle" font-size="11" fill="#374151">Known tools only. Names resolved.</text>
<text x="900" y="310" text-anchor="middle" font-size="11" fill="#374151">Repeated step is skipped.</text>
<line x1="700" y1="285" x2="740" y2="285" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="440" y1="324" x2="440" y2="352" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>

<rect x="180" y="352" width="520" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
<text x="440" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#064E3B">3  MCP tools/call</text>
<text x="440" y="396" text-anchor="middle" font-size="11" fill="#374151">JSON-RPC 2.0. Documents or a Python service. The model does not compute.</text>
<line x1="440" y1="416" x2="440" y2="440" stroke="#475569" stroke-width="1.8"/>
<line x1="70" y1="440" x2="1030" y2="440" stroke="#475569" stroke-width="1.8"/>

<rect x="40" y="458" width="150" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
<text x="115" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#78350F">Python: quality</text>
<text x="115" y="498" text-anchor="middle" font-size="10" fill="#374151">ids, dates, signs</text>
<text x="115" y="514" text-anchor="middle" font-size="10" fill="#374151">a bad row stops</text>
<line x1="115" y1="440" x2="115" y2="458" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

<rect x="200" y="458" width="150" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
<text x="275" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#78350F">Python: market</text>
<text x="275" y="498" text-anchor="middle" font-size="10" fill="#374151">Yahoo spot and vol</text>
<text x="275" y="514" text-anchor="middle" font-size="10" fill="#374151">scenario PnL, stress</text>
<line x1="275" y1="440" x2="275" y2="458" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

<rect x="360" y="458" width="150" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
<text x="435" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#78350F">Python: simulation</text>
<text x="435" y="498" text-anchor="middle" font-size="10" fill="#374151">correlated paths</text>
<text x="435" y="514" text-anchor="middle" font-size="10" fill="#374151">engine checks first</text>
<line x1="435" y1="440" x2="435" y2="458" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

<rect x="520" y="458" width="150" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
<text x="595" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#78350F">Python: margin</text>
<text x="595" y="498" text-anchor="middle" font-size="10" fill="#374151">threshold, MTA</text>
<text x="595" y="514" text-anchor="middle" font-size="10" fill="#374151">IM proxy, notice</text>
<line x1="595" y1="440" x2="595" y2="458" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

<rect x="680" y="458" width="150" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
<text x="755" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#78350F">Python: collateral</text>
<text x="755" y="498" text-anchor="middle" font-size="10" fill="#374151">haircut table</text>
<text x="755" y="514" text-anchor="middle" font-size="10" fill="#374151">shortfall, surplus</text>
<line x1="755" y1="440" x2="755" y2="458" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

<rect x="840" y="458" width="120" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
<text x="900" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="#78350F">Python: exposure</text>
<text x="900" y="498" text-anchor="middle" font-size="10" fill="#374151">exposure, EL</text>
<text x="900" y="514" text-anchor="middle" font-size="10" fill="#374151">alerts, drafts</text>
<line x1="900" y1="440" x2="900" y2="458" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="970" y="458" width="110" height="78" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
<text x="1025" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Documents</text>
<text x="1025" y="498" text-anchor="middle" font-size="10" fill="#374151">Qwen reads</text>
<text x="1025" y="514" text-anchor="middle" font-size="10" fill="#374151">quote gate</text>
<line x1="1025" y1="440" x2="1025" y2="458" stroke="#4F46E5" stroke-width="1.6" marker-end="url(#a)"/>

<line x1="440" y1="536" x2="440" y2="564" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="180" y="564" width="520" height="72" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
<text x="440" y="586" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">4  WORDING - Qwen3-8B</text>
<text x="440" y="604" text-anchor="middle" font-size="11" fill="#374151">Three or four sentences from the tool JSON only</text>
<text x="440" y="620" text-anchor="middle" font-size="11" fill="#374151">One rewrite, then the sentences are dropped</text>
<rect x="740" y="564" width="320" height="72" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="900" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#4C1D95">CRITIC - Python</text>
<text x="900" y="610" text-anchor="middle" font-size="11" fill="#374151">Numbers, status, and [S#] must be in the JSON</text>
<line x1="700" y1="600" x2="740" y2="600" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#a)"/>

<line x1="440" y1="636" x2="440" y2="664" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="180" y="664" width="520" height="78" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6"/>
<text x="440" y="688" text-anchor="middle" font-size="13" font-weight="700" fill="#7C2D12">5  HUMAN SIGN-OFF</text>
<text x="440" y="708" text-anchor="middle" font-size="11" fill="#374151">approve &lt;id&gt; &lt;field&gt; by &lt;name&gt;</text>
<text x="440" y="724" text-anchor="middle" font-size="11" fill="#374151">Backup of the terms, then one audit row. The model cannot sign.</text>
<rect x="740" y="664" width="320" height="78" rx="10" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.6"/>
<text x="900" y="694" text-anchor="middle" font-size="13" font-weight="700" fill="#7C2D12">AUDIT</text>
<text x="900" y="714" text-anchor="middle" font-size="11" fill="#374151">pending draft, backup, csa_terms_audit.csv</text>

<rect x="40" y="780" width="500" height="70" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="290" y="806" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Book - 6 names</text>
<text x="290" y="826" text-anchor="middle" font-size="11" fill="#374151">Each limit is the simulated peak times a factor. Yahoo prices.</text>
<rect x="560" y="780" width="500" height="70" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="810" y="806" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Filings and desk files</text>
<text x="810" y="826" text-anchor="middle" font-size="11" fill="#374151">500 credit-support, 300 contracts, 150 disclosures, BCBS text. Quote gate.</text>

<text x="550" y="890" text-anchor="middle" font-size="11" fill="#6B7280">Trace log: question, plan, tools, flags, latency. No prompt and no key.</text>
<text x="550" y="910" text-anchor="middle" font-size="11" fill="#6B7280">PFE is not SA-CCR. Initial margin is not SIMM. Expected loss is not regulatory EAD.</text>
<text x="550" y="940" text-anchor="middle" font-size="11" fill="#64748B">Two agents call Qwen. Documents proposes one term. Python checks the quote and owns every calculation.</text>
</svg>
